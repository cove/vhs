<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VHS Tuner Plain HTML Wizard</title>
  <style>
    :root {
      --bg: #002b36;
      --bg-soft: #073642;
      --bg-alt: #0a3944;
      --line: #1b5866;
      --text: #93a1a1;
      --text-strong: #eee8d5;
      --accent: #268bd2;
      --accent-soft: #2aa198;
      --good: #859900;
      --bad: #dc322f;
      --warn: #b58900;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(1200px 700px at 100% -10%, #0b4a56 0%, transparent 55%), var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .app {
      min-height: 100vh;
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      gap: 10px;
    }

    .title {
      font-size: 20px;
      color: var(--text-strong);
      letter-spacing: 0.3px;
    }

    .status {
      min-height: 24px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(7, 54, 66, 0.6);
      font-size: 13px;
    }

    .status.error {
      border-color: var(--bad);
      color: #f4b3a9;
    }

    .steps {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-pill {
      border: 1px solid var(--line);
      background: var(--bg-soft);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .step-pill.active {
      border-color: var(--accent);
      color: var(--text-strong);
      background: #0a4050;
    }

    .page { display: none; min-height: 0; }
    .page.active { display: block; }

    .panel {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(7,54,66,0.95), rgba(5,43,53,0.95));
      border-radius: 10px;
      padding: 10px;
      min-height: 0;
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--text-strong);
      letter-spacing: 0.2px;
    }

    .page-load-layout {
      height: calc(100vh - 170px);
      display: grid;
      gap: 10px;
      grid-template-columns: 240px minmax(420px, 1fr);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: auto;
      max-height: 100%;
      padding-right: 2px;
    }

    .item-btn {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      color: var(--text);
      border-radius: 8px;
      padding: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.25;
    }

    .item-btn:hover { border-color: var(--accent-soft); }
    .item-btn.active {
      border-color: var(--accent);
      background: #0b4150;
      color: var(--text-strong);
    }

    .chapter-row {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: 8px;
    }

    .chapter-row .meta {
      color: #6eb9c1;
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
    }

    .chapter-row .title {
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: inherit;
    }

    .details {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
      background: rgba(0, 32, 41, 0.6);
      font-family: "Consolas", "Courier New", monospace;
      font-size: 12px;
      min-height: 90px;
    }

    .controls {
      margin-top: 10px;
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
    }

    .field {
      display: grid;
      gap: 4px;
      font-size: 12px;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #052a33;
      color: var(--text-strong);
      padding: 8px;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }

    button.action {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #094152;
      color: var(--text-strong);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    button.action.primary { border-color: var(--accent); background: #0f5370; }
    button.action.warn { border-color: var(--warn); }
    button.action:disabled { opacity: 0.55; cursor: not-allowed; }

    .page-review-layout {
      height: calc(100vh - 170px);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 10px;
    }

    .review-top {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .review-stats { font-size: 13px; }

    .iqr-box {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 12px;
    }

    .iqr-box input[type="range"] { width: 220px; }

    .iqr-spark {
      width: 100%;
      height: 68px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #05252e;
      display: block;
    }

    .spark-panel {
      display: grid;
      gap: 6px;
      align-content: start;
      min-height: 0;
    }

    .spark-meta {
      font-size: 11px;
      color: #8bb7b7;
      min-height: 14px;
    }

    .frame-grid {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 32, 41, 0.55);
      padding: 8px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 8px;
      align-content: start;
      min-height: 0;
    }

    .frame-card {
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #03232b;
      padding: 6px;
      display: grid;
      gap: 6px;
    }

    .frame-card.good { border-color: var(--good); }
    .frame-card.bad { border-color: var(--bad); }

    .frame-card img {
      width: 100%;
      max-height: 112px;
      object-fit: contain;
      background: #001c24;
      border-radius: 4px;
    }

    .frame-label {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 11px;
      line-height: 1.25;
      color: #c9d6d6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .frame-toggle {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0a3f4e;
      color: var(--text-strong);
      padding: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .page-final-layout {
      height: calc(100vh - 170px);
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 10px;
    }

    .summary-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 32, 41, 0.6);
      padding: 10px;
      white-space: pre-wrap;
      overflow: auto;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 12px;
      color: #d2dfdf;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 23, 30, 0.75);
      z-index: 1000;
    }

    .overlay.active { display: flex; }

    .overlay-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #08323c;
      min-width: 300px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .overlay-progress {
      width: 100%;
      height: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #06303a;
      overflow: hidden;
    }

    .overlay-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2aa198, #268bd2);
      transition: width 0.15s linear;
    }

    .overlay-progress-text {
      font-size: 11px;
      color: #9ac4c4;
      text-align: right;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #0e5564;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1100px) {
      .page-load-layout { grid-template-columns: 1fr; height: auto; }
      .controls { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .page-review-layout, .page-final-layout { height: auto; }
      .frame-grid { min-height: 420px; }
      .review-top { grid-template-columns: 1fr; }
      .iqr-box input[type="range"] { width: 180px; }
    }

    #page2:fullscreen {
      display: block;
      padding: 10px;
      background: var(--bg);
    }

    #page2:fullscreen .page-review-layout {
      height: calc(100vh - 20px);
    }

    body.review-fullscreen-fallback .app {
      padding: 0;
      grid-template-rows: 1fr;
      gap: 0;
    }

    body.review-fullscreen-fallback .title,
    body.review-fullscreen-fallback .status,
    body.review-fullscreen-fallback .steps,
    body.review-fullscreen-fallback #page1,
    body.review-fullscreen-fallback #page3 {
      display: none !important;
    }

    body.review-fullscreen-fallback #page2 {
      display: block !important;
      position: fixed;
      inset: 0;
      z-index: 900;
      padding: 12px;
      background: var(--bg);
    }

    body.review-fullscreen-fallback #page2 .page-review-layout {
      height: calc(100vh - 24px);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="title">VHS Tuner Plain HTML Wizard</div>
    <div id="status" class="status"></div>
    <div class="steps">
      <div id="stepPill1" class="step-pill active">1/3 Load Chapter</div>
      <div id="stepPill2" class="step-pill">2/3 Review Frames + IQR</div>
      <div id="stepPill3" class="step-pill">3/3 Summary + Save</div>
    </div>

    <section id="page1" class="page active">
      <div class="page-load-layout">
        <aside class="panel">
          <h2 class="panel-title">Archives</h2>
          <div id="archiveList" class="list"></div>
        </aside>

        <main class="panel">
          <h2 class="panel-title">Chapters</h2>
          <div id="chapterList" class="list" style="max-height: 38vh;"></div>

          <h2 class="panel-title" style="margin-top: 12px;">Selected Chapter</h2>
          <div id="chapterDetails" class="details">No chapter selected.</div>

          <div class="controls">
            <label class="field">Start Frame
              <input id="startFrame" type="number" min="0" step="1">
            </label>
            <label class="field">End Frame (exclusive)
              <input id="endFrame" type="number" min="1" step="1">
            </label>
            <label class="field">Sample Rate (1 / N, use 1 for all frames)
              <input id="sampleStride" type="number" min="1" step="1" value="1">
            </label>
            <label class="field">Bad Batch Proximity
              <input id="context" type="number" min="0" step="1" value="10">
            </label>
          </div>

          <div class="actions">
            <span></span>
            <button id="nextToReview" class="action primary">Next: Load Frames</button>
          </div>
        </main>
      </div>
    </section>

    <section id="page2" class="page">
      <div class="page-review-layout">
        <div class="panel review-top">
          <div id="reviewStats" class="review-stats">No frames loaded.</div>
          <div class="iqr-box">
            <label for="iqrK">IQR k</label>
            <input id="iqrK" type="range" min="0" max="12" step="0.05" value="3.5">
            <span id="iqrLabel">3.50</span>
            <button id="applyIqr" class="action">Apply</button>
            <button id="toggleFullscreen" class="action">Fullscreen</button>
          </div>
        </div>
        <div class="panel spark-panel">
          <svg id="iqrSpark" class="iqr-spark" viewBox="0 0 320 68" preserveAspectRatio="none"></svg>
          <div id="sparkMeta" class="spark-meta"></div>
        </div>

        <div id="frameGrid" class="frame-grid"></div>

        <div class="actions">
          <button id="backToLoad" class="action warn">Back</button>
          <button id="nextToSummary" class="action primary">Next: Summary</button>
        </div>
      </div>
    </section>

    <section id="page3" class="page">
      <div class="page-final-layout">
        <div id="summaryBox" class="summary-box">No summary yet.</div>
        <div class="actions">
          <button id="backToReview" class="action warn">Back</button>
          <button id="saveAndReturn" class="action primary">Save and Return to Chapters</button>
        </div>
      </div>
    </section>
  </div>

  <div id="overlay" class="overlay">
    <div class="overlay-card">
      <div style="display:flex; gap:10px; align-items:center;">
        <div class="spinner"></div>
        <strong style="color: var(--text-strong);">Loading</strong>
      </div>
      <div id="overlayMsg" style="font-size:13px;">Working...</div>
      <div class="overlay-progress">
        <div id="overlayProgressFill" class="overlay-progress-fill"></div>
      </div>
      <div id="overlayProgressText" class="overlay-progress-text"></div>
    </div>
  </div>

  <script>
    const state = {
      archives: [],
      archive: '',
      chapters: [],
      chapter: '',
      review: null,
      loadSettings: null,
      iqrApplySeq: 0,
      liveIqrPending: false,
      liveIqrInFlight: false,
      visibleRange: null,
    };

    const statusEl = document.getElementById('status');
    const overlayEl = document.getElementById('overlay');
    const overlayMsgEl = document.getElementById('overlayMsg');
    const overlayProgressFillEl = document.getElementById('overlayProgressFill');
    const overlayProgressTextEl = document.getElementById('overlayProgressText');

    const archiveListEl = document.getElementById('archiveList');
    const chapterListEl = document.getElementById('chapterList');
    const chapterDetailsEl = document.getElementById('chapterDetails');

    const startFrameEl = document.getElementById('startFrame');
    const endFrameEl = document.getElementById('endFrame');
    const sampleStrideEl = document.getElementById('sampleStride');
    const contextEl = document.getElementById('context');

    const iqrEl = document.getElementById('iqrK');
    const iqrLabelEl = document.getElementById('iqrLabel');
    const reviewStatsEl = document.getElementById('reviewStats');
    const frameGridEl = document.getElementById('frameGrid');
    const summaryBoxEl = document.getElementById('summaryBox');
    const iqrSparkEl = document.getElementById('iqrSpark');
    const sparkMetaEl = document.getElementById('sparkMeta');
    const page2El = document.getElementById('page2');
    const fullscreenBtnEl = document.getElementById('toggleFullscreen');

    let autoIqrTimer = null;
    let visibleRangeRefreshPending = false;
    let loadProgressPollTimer = null;

    function setStatus(text, isError = false) {
      statusEl.textContent = text || '';
      statusEl.classList.toggle('error', Boolean(isError));
    }

    function setLoading(active, message = 'Working...') {
      overlayEl.classList.toggle('active', Boolean(active));
      overlayMsgEl.textContent = message;
      if (!active) {
        if (overlayProgressFillEl) overlayProgressFillEl.style.width = '0%';
        if (overlayProgressTextEl) overlayProgressTextEl.textContent = '';
      }
    }

    function setOverlayProgress(value) {
      const p = Math.max(0, Math.min(100, Number(value) || 0));
      if (overlayProgressFillEl) overlayProgressFillEl.style.width = `${p.toFixed(1)}%`;
      if (overlayProgressTextEl) overlayProgressTextEl.textContent = `${Math.round(p)}%`;
    }

    async function pollLoadProgressOnce() {
      try {
        const p = await api('/api/load_progress');
        const done = Number(p.sample_done || 0);
        const total = Number(p.sample_total || 0);
        const msg = String(p.message || '');
        if (msg) {
          if (total > 0) {
            overlayMsgEl.textContent = `${msg} (${done}/${total})`;
          } else {
            overlayMsgEl.textContent = msg;
          }
        }
        setOverlayProgress(Number(p.progress || 0));
      } catch (_err) {
        // Ignore transient polling errors while main request is in-flight.
      }
    }

    function startLoadProgress(message) {
      if (loadProgressPollTimer) {
        window.clearInterval(loadProgressPollTimer);
        loadProgressPollTimer = null;
      }
      setLoading(true, message || 'Loading chapter...');
      setOverlayProgress(1);
      pollLoadProgressOnce();
      loadProgressPollTimer = window.setInterval(pollLoadProgressOnce, 180);
    }

    function finishLoadProgress(success = true) {
      if (loadProgressPollTimer) {
        window.clearInterval(loadProgressPollTimer);
        loadProgressPollTimer = null;
      }
      if (success) {
        setOverlayProgress(100);
        window.setTimeout(() => {
          setLoading(false);
        }, 180);
      } else {
        setLoading(false);
      }
    }

    async function api(path, method = 'GET', body = null) {
      const options = { method, headers: {} };
      if (body !== null) {
        options.headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(body);
      }
      const res = await fetch(path, options);
      const payload = await res.json();
      if (!res.ok || !payload.ok) {
        throw new Error(payload.error || `HTTP ${res.status}`);
      }
      return payload;
    }

    function setStep(step) {
      const pages = ['page1', 'page2', 'page3'];
      const pills = ['stepPill1', 'stepPill2', 'stepPill3'];
      if (step !== 2 && document.fullscreenElement === page2El && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
      if (step !== 2 && document.body.classList.contains('review-fullscreen-fallback')) {
        document.body.classList.remove('review-fullscreen-fallback');
      }
      pages.forEach((id, i) => {
        document.getElementById(id).classList.toggle('active', i + 1 === step);
        document.getElementById(pills[i]).classList.toggle('active', i + 1 === step);
      });
      updateFullscreenButton();
      if (step === 2 && state.review && Array.isArray(state.review.frames) && state.review.frames.length) {
        window.requestAnimationFrame(() => {
          scheduleVisibleRangeRefresh();
        });
      }
    }

    function chapterByTitle(title) {
      return state.chapters.find(c => c.title === title) || null;
    }

    function renderArchives() {
      archiveListEl.innerHTML = '';
      state.archives.forEach(name => {
        const btn = document.createElement('button');
        btn.className = `item-btn ${name === state.archive ? 'active' : ''}`;
        btn.textContent = name;
        btn.addEventListener('click', () => loadArchive(name, null));
        archiveListEl.appendChild(btn);
      });
    }

    function renderChapters() {
      chapterListEl.innerHTML = '';
      state.chapters.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = `item-btn chapter-row ${ch.title === state.chapter ? 'active' : ''}`;
        btn.innerHTML = `
          <div>${String(ch.index).padStart(2, '0')}</div>
          <div class="title" title="${escapeHtml(ch.title)}">${escapeHtml(ch.title)}</div>
          <div class="meta">${ch.time} | b${ch.bad}</div>
        `;
        btn.addEventListener('click', () => {
          state.chapter = ch.title;
          startFrameEl.value = ch.start_frame;
          endFrameEl.value = ch.end_frame;
          renderChapters();
          renderChapterDetails();
        });
        chapterListEl.appendChild(btn);
      });
    }

    function renderChapterDetails() {
      const ch = chapterByTitle(state.chapter);
      if (!ch) {
        chapterDetailsEl.textContent = 'Select a chapter.';
        return;
      }
      chapterDetailsEl.textContent = `${ch.title}\nDuration: ${ch.time} | Frames: ${ch.frames} | BAD already: ${ch.bad}\nFrame span: ${ch.start_frame} - ${ch.end_frame} (end exclusive)`;
    }

    function statsText(stats, threshold) {
      return `Bad: ${stats.bad} (${Math.round((100 * stats.bad) / Math.max(1, stats.total))}%) | Good: ${stats.good} | Threshold: ${threshold.toFixed(4)} | Overrides: ${stats.overrides} | n=${stats.total} | shown=${stats.shown}`;
    }

    function renderSparkline(frames, threshold) {
      if (!iqrSparkEl || !sparkMetaEl) return;
      const data = Array.isArray(frames) ? frames : [];
      if (!data.length) {
        iqrSparkEl.innerHTML = '';
        sparkMetaEl.textContent = 'No score data loaded.';
        state.visibleRange = null;
        return;
      }

      const w = Math.max(320, Math.floor(iqrSparkEl.clientWidth || 320));
      const h = 68;
      const pad = 6;
      const scores = data.map(f => Number(f.score || 0));
      const badCount = data.filter(f => f.status === 'bad').length;
      const minV = Math.min(...scores, Number(threshold || 0));
      const maxV = Math.max(...scores, Number(threshold || 0));
      const span = Math.max(1e-9, maxV - minV);

      const xFor = (i) => {
        if (scores.length <= 1) return w / 2;
        return pad + (i * (w - pad * 2)) / (scores.length - 1);
      };
      const yFor = (v) => h - pad - ((v - minV) / span) * (h - pad * 2);

      const points = scores.map((v, i) => `${xFor(i).toFixed(2)},${yFor(v).toFixed(2)}`).join(' ');
      const yThr = yFor(Number(threshold || 0));
      iqrSparkEl.setAttribute('viewBox', `0 0 ${w} ${h}`);

      let viewportSvg = '';
      if (state.visibleRange && Number.isFinite(state.visibleRange.start) && Number.isFinite(state.visibleRange.end)) {
        const startIdx = Math.max(0, Math.min(scores.length - 1, Number(state.visibleRange.start)));
        const endIdx = Math.max(startIdx, Math.min(scores.length - 1, Number(state.visibleRange.end)));
        const xStart = xFor(startIdx);
        const xEnd = xFor(endIdx);
        const xMid = (xStart + xEnd) / 2;
        viewportSvg = `
          <rect x="${Math.min(xStart, xEnd).toFixed(2)}" y="${pad}" width="${Math.max(1, Math.abs(xEnd - xStart)).toFixed(2)}" height="${(h - pad * 2).toFixed(2)}" fill="#268bd2" opacity="0.15"></rect>
          <line x1="${xStart.toFixed(2)}" y1="${pad}" x2="${xStart.toFixed(2)}" y2="${(h - pad).toFixed(2)}" stroke="#268bd2" stroke-width="1.3" opacity="0.95"></line>
          <line x1="${xEnd.toFixed(2)}" y1="${pad}" x2="${xEnd.toFixed(2)}" y2="${(h - pad).toFixed(2)}" stroke="#268bd2" stroke-width="1.3" opacity="0.95"></line>
          <line x1="${xMid.toFixed(2)}" y1="${pad}" x2="${xMid.toFixed(2)}" y2="${(h - pad).toFixed(2)}" stroke="#6ec5ff" stroke-width="1.0" opacity="0.9"></line>
        `;
      }

      iqrSparkEl.innerHTML = `
        <polyline points="${points}" fill="none" stroke="#2aa198" stroke-width="1.6" opacity="0.95"></polyline>
        <line x1="${pad}" y1="${yThr.toFixed(2)}" x2="${(w - pad).toFixed(2)}" y2="${yThr.toFixed(2)}" stroke="#dc322f" stroke-width="1.4" opacity="0.95"></line>
        ${viewportSvg}
      `;
      if (state.visibleRange) {
        const start = Math.max(0, Number(state.visibleRange.start)) + 1;
        const end = Math.max(start, Number(state.visibleRange.end) + 1);
        sparkMetaEl.textContent = `Scores: min ${minV.toFixed(2)} | max ${maxV.toFixed(2)} | threshold ${Number(threshold || 0).toFixed(2)} | auto bad ${badCount} | view ${start}-${end}/${scores.length}`;
      } else {
        sparkMetaEl.textContent = `Scores: min ${minV.toFixed(2)} | max ${maxV.toFixed(2)} | threshold ${Number(threshold || 0).toFixed(2)} | auto bad ${badCount}`;
      }
    }

    function _computeVisibleIndexRange() {
      const cards = Array.from(frameGridEl.querySelectorAll('.frame-card'));
      if (!cards.length) return null;
      const gridRect = frameGridEl.getBoundingClientRect();
      let minIdx = null;
      let maxIdx = null;
      for (let i = 0; i < cards.length; i += 1) {
        const r = cards[i].getBoundingClientRect();
        const isVisible = r.bottom > gridRect.top && r.top < gridRect.bottom;
        if (!isVisible) continue;
        if (minIdx === null || i < minIdx) minIdx = i;
        if (maxIdx === null || i > maxIdx) maxIdx = i;
      }
      if (minIdx === null || maxIdx === null) return null;
      return { start: minIdx, end: maxIdx };
    }

    function refreshVisibleRangeFromGrid() {
      if (!state.review || !Array.isArray(state.review.frames) || !state.review.frames.length) {
        state.visibleRange = null;
        return;
      }
      const range = _computeVisibleIndexRange();
      state.visibleRange = range || { start: 0, end: state.review.frames.length - 1 };
      renderSparkline(state.review.frames, state.review.threshold || 0);
    }

    function scheduleVisibleRangeRefresh() {
      if (visibleRangeRefreshPending) return;
      visibleRangeRefreshPending = true;
      window.requestAnimationFrame(() => {
        visibleRangeRefreshPending = false;
        refreshVisibleRangeFromGrid();
      });
    }

    function scheduleAutoApplyIqr() {
      if (!state.review) return;
      if (autoIqrTimer) window.clearTimeout(autoIqrTimer);
      autoIqrTimer = window.setTimeout(() => {
        applyIqr(false);
      }, 120);
    }

    function updateFullscreenButton() {
      const active = document.fullscreenElement === page2El || document.body.classList.contains('review-fullscreen-fallback');
      fullscreenBtnEl.textContent = active ? 'Exit Fullscreen' : 'Fullscreen';
    }

    async function toggleReviewFullscreen() {
      if (!page2El) return;
      try {
        if (document.fullscreenEnabled && page2El.requestFullscreen) {
          if (document.fullscreenElement === page2El) {
            await document.exitFullscreen();
          } else {
            await page2El.requestFullscreen();
          }
        } else {
          document.body.classList.toggle('review-fullscreen-fallback');
        }
      } catch (err) {
        document.body.classList.toggle('review-fullscreen-fallback');
      }
      updateFullscreenButton();
    }

    function renderReviewFrames(frames) {
      frameGridEl.innerHTML = '';
      if (!frames || !frames.length) {
        frameGridEl.textContent = 'No frames loaded.';
        renderSparkline([], 0);
        return;
      }
      const fragment = document.createDocumentFragment();
      frames.forEach(frame => {
        const card = document.createElement('div');
        card.className = `frame-card ${frame.status}`;
        card.dataset.fid = String(frame.fid);
        card.innerHTML = `
          <img src="${frame.image}" alt="frame ${frame.fid}">
          <div class="frame-label">${escapeHtml(frame.label)}</div>
          <button class="frame-toggle" data-fid="${frame.fid}">Toggle Good/Bad</button>
        `;
        fragment.appendChild(card);
      });
      frameGridEl.appendChild(fragment);
      renderSparkline(frames, state.review ? state.review.threshold : 0);
      scheduleVisibleRangeRefresh();
    }

    function applyFrameUpdates(updates) {
      const map = new Map((updates || []).map(f => [String(f.fid), f]));
      frameGridEl.querySelectorAll('.frame-card').forEach(card => {
        const fid = card.dataset.fid;
        const update = map.get(fid);
        if (!update) return;
        card.classList.toggle('bad', update.status === 'bad');
        card.classList.toggle('good', update.status === 'good');
        const label = card.querySelector('.frame-label');
        if (label) label.textContent = update.label;
      });
    }

    async function loadArchives() {
      const payload = await api('/api/archives');
      state.archives = payload.archives || [];
      if (!state.archives.length) {
        setStatus('No archives found.', true);
        return;
      }
      state.archive = payload.selected || state.archives[0];
      renderArchives();
      await loadArchive(state.archive, null);
    }

    async function loadArchive(archive, chapter) {
      setLoading(true, `Loading chapter metadata for ${archive}...`);
      try {
        const q = new URLSearchParams({ archive });
        if (chapter) q.set('chapter', chapter);
        const payload = await api(`/api/archive_state?${q.toString()}`);
        const st = payload.archive_state;
        state.archive = st.archive;
        state.chapter = st.chapter;
        state.chapters = st.chapters || [];
        startFrameEl.value = st.start_frame;
        endFrameEl.value = st.end_frame;
        renderArchives();
        renderChapters();
        renderChapterDetails();
        setStatus(st.status || 'Archive loaded.');
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        setLoading(false);
      }
    }

    async function loadFrames() {
      if (!state.archive || !state.chapter) {
        setStatus('Select an archive and chapter first.', true);
        return;
      }

      const payload = {
        archive: state.archive,
        chapter: state.chapter,
        start_frame: Number(startFrameEl.value || 0),
        end_frame: Number(endFrameEl.value || 1),
        sample_stride: Number(sampleStrideEl.value || 1),
        context: Number(contextEl.value || 10),
        iqr_k: Number(iqrEl.value || 3.5),
        strict_sampling: true,
        exact_extract: true,
        debug_extract: false,
      };

      if (autoIqrTimer) {
        window.clearTimeout(autoIqrTimer);
        autoIqrTimer = null;
      }
      state.iqrApplySeq += 1;

      let loadFailed = false;
      startLoadProgress('Extracting chapter and sampling frames...');
      try {
        const result = await api('/api/load_chapter', 'POST', payload);
        state.review = result.review;
        state.loadSettings = result.settings || null;
        reviewStatsEl.textContent = statsText(result.review.stats, result.review.threshold);
        renderReviewFrames(result.review.frames);
        iqrEl.value = String(payload.iqr_k);
        iqrLabelEl.textContent = Number(payload.iqr_k).toFixed(2);
        const s = state.loadSettings;
        const strideText = s ? `1/${s.sample_stride}` : `1/${payload.sample_stride}`;
        const totalText = s ? `${s.sampled_count}/${s.chapter_frame_count}` : `${result.review.stats.total}`;
        setStatus(`Loaded ${totalText} frame(s) for ${state.chapter} (stride ${strideText}).`);
        setStep(2);
      } catch (err) {
        loadFailed = true;
        setStatus(err.message, true);
      } finally {
        finishLoadProgress(!loadFailed);
      }
    }

    async function applyIqr(isManual = true) {
      if (!state.review) return;
      if (!isManual && state.liveIqrInFlight) {
        state.liveIqrPending = true;
        return;
      }
      const k = Number(iqrEl.value || 3.5);
      iqrLabelEl.textContent = k.toFixed(2);
      const callSeq = ++state.iqrApplySeq;
      if (isManual) {
        setLoading(true, 'Applying IQR threshold...');
      } else {
        state.liveIqrInFlight = true;
        setStatus(`Reprocessing frame statuses (IQR k=${k.toFixed(2)})...`);
      }
      try {
        const result = await api('/api/apply_iqr', 'POST', { iqr_k: k });
        if (callSeq !== state.iqrApplySeq) return;
        const review = result.review;
        const previous = new Map((state.review.frames || []).map(f => [String(f.fid), f.status]));
        let changed = 0;
        for (const f of (review.frames || [])) {
          if (previous.get(String(f.fid)) !== f.status) changed += 1;
        }
        reviewStatsEl.textContent = statsText(review.stats, review.threshold);
        applyFrameUpdates(review.frames);
        renderSparkline(review.frames, review.threshold);
        state.review = {
          ...state.review,
          stats: review.stats,
          threshold: review.threshold,
          frames: review.frames || [],
        };
        setStatus(`Applied IQR k=${k.toFixed(2)} (${changed} frame(s) changed).`);
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        if (isManual) {
          setLoading(false);
        } else {
          state.liveIqrInFlight = false;
          if (state.liveIqrPending) {
            state.liveIqrPending = false;
            applyIqr(false);
          }
        }
      }
    }

    async function toggleFrame(fid) {
      setLoading(true, `Updating frame ${fid}...`);
      try {
        const result = await api('/api/toggle_frame', 'POST', { fid: Number(fid) });
        const frame = result.frame;
        if (frame) applyFrameUpdates([frame]);
        reviewStatsEl.textContent = statsText(result.review.stats, result.review.threshold);
        renderSparkline(result.review.frames, result.review.threshold);
        state.review = {
          ...state.review,
          stats: result.review.stats,
          threshold: result.review.threshold,
          frames: result.review.frames || [],
        };
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        setLoading(false);
      }
    }

    async function loadSummary() {
      setLoading(true, 'Building summary...');
      try {
        const result = await api('/api/summary');
        summaryBoxEl.textContent = result.summary;
        setStep(3);
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        setLoading(false);
      }
    }

    async function saveAndReturn() {
      setLoading(true, 'Saving BAD frame selections...');
      try {
        const result = await api('/api/save', 'POST', {});
        setStatus(result.message || 'Saved.');

        const st = result.archive_state;
        state.archive = st.archive;
        state.chapter = st.chapter;
        state.chapters = st.chapters || [];
        startFrameEl.value = st.start_frame;
        endFrameEl.value = st.end_frame;

        renderArchives();
        renderChapters();
        renderChapterDetails();
        setStep(1);
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        setLoading(false);
      }
    }

    function escapeHtml(input) {
      return String(input)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    document.getElementById('nextToReview').addEventListener('click', loadFrames);
    document.getElementById('backToLoad').addEventListener('click', () => setStep(1));
    document.getElementById('nextToSummary').addEventListener('click', loadSummary);
    document.getElementById('backToReview').addEventListener('click', () => setStep(2));
    document.getElementById('saveAndReturn').addEventListener('click', saveAndReturn);
    document.getElementById('applyIqr').addEventListener('click', () => applyIqr(true));
    fullscreenBtnEl.addEventListener('click', toggleReviewFullscreen);
    document.addEventListener('fullscreenchange', () => {
      updateFullscreenButton();
      scheduleVisibleRangeRefresh();
    });
    iqrEl.addEventListener('input', () => {
      iqrLabelEl.textContent = Number(iqrEl.value || 0).toFixed(2);
      scheduleAutoApplyIqr();
    });
    iqrEl.addEventListener('change', () => {
      applyIqr(true);
    });

    frameGridEl.addEventListener('click', (event) => {
      const button = event.target.closest('.frame-toggle');
      if (!button) return;
      toggleFrame(button.dataset.fid);
    });
    frameGridEl.addEventListener('scroll', () => {
      scheduleVisibleRangeRefresh();
    });

    window.addEventListener('load', async () => {
      iqrLabelEl.textContent = Number(iqrEl.value).toFixed(2);
      updateFullscreenButton();
      setStatus('Loading archives...');
      try {
        await loadArchives();
      } catch (err) {
        setStatus(err.message, true);
      }
    });

    window.addEventListener('resize', () => {
      if (state.review && Array.isArray(state.review.frames) && state.review.frames.length) {
        scheduleVisibleRangeRefresh();
      }
    });
  </script>
</body>
</html>
